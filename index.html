<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Jogos do Dia</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f2f2f2;
    }
    .jogo {
      padding: 15px;
      background: #fff;
      margin: 10px 0;
      border-radius: 8px;
    }
    .jogo h3 {
      margin: 0;
    }
  </style>
</head>
<body>

<h1>Jogos de Hoje 🔥</h1>
<div id="lista"></div>

<script>
  async function buscarJogos() {
    const hoje = new Date().toISOString().split('T')[0];
    const url = `https://www.thesportsdb.com/api/v1/json/1/eventsday.php?d=${hoje}&s=Soccer`;

    try {
      const res = await fetch(url);
      const data = await res.json();

      const jogos = data.events;
      const container = document.getElementById('lista');
      container.innerHTML = "";

      if (!jogos) {
        container.innerHTML = "<p>Nenhum jogo encontrado hoje 😕</p>";
        return;
      }

      jogos.forEach(j => {
        container.innerHTML += `
          <div class="jogo">
            <h3>${j.strEvent}</h3>
            <p>Horário: ${j.strTime}</p>
          </div>
        `;
      });

    } catch (err) {
      console.error(err);
      document.getElementById('lista').innerHTML = "Erro ao carregar";
    }
  }

  buscarJogos();
</script>

</body>
</html>
