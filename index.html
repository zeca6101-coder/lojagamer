<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Minha IA</title>
<style>
body{
background:#0f172a;
color:white;
font-family:Arial;
text-align:center;
padding:20px
}
input{
width:80%;
padding:12px;
margin:10px;
border-radius:8px;
border:none
}
button{
padding:10px 20px;
margin:5px;
border:none;
border-radius:8px;
background:#22c55e;
color:white;
cursor:pointer
}
img{
max-width:300px;
margin-top:20px;
border-radius:10px
}
#response{
margin-top:20px;
white-space:pre-wrap
}
</style>
</head>
<body>

<h1>🤖 Minha IA Inteligente</h1>

<input type="text" id="prompt" placeholder="Digite algo...">
<br>
<button onclick="chat()">Perguntar</button>
<button onclick="gerarImagem()">Gerar Imagem</button>

<div id="response"></div>

<script>
async function chat(){
const message = document.getElementById("prompt").value;

const res = await fetch("/api/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message,type:"text"})
});

const data = await res.json();
document.getElementById("response").innerText =
data[0]?.generated_text || "Erro";
}

async function gerarImagem(){
const message = document.getElementById("prompt").value;

const res = await fetch("/api/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message,type:"image"})
});

const blob = await res.blob();
const img = document.createElement("img");
img.src = URL.createObjectURL(blob);

document.getElementById("response").innerHTML="";
document.getElementById("response").appendChild(img);
}
</script>

</body>
</html>
