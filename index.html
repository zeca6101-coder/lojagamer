<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Jogos de Hoje 🔥</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            padding: 20px;
        }
        .jogo {
            padding: 10px;
            background: white;
            margin-bottom: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<h2>Jogos de Hoje 🔥</h2>
<div id="lista"></div>

<script>
const jogos = [
    "Barcelona x Real Madrid",
    "PSG x Lyon",
    "Liverpool x Chelsea",
    "Milan x Inter",
    "Flamengo x Palmeiras"
];

const lista = document.getElementById("lista");

jogos.forEach(jogo => {
    const item = document.createElement("div");
    item.className = "jogo";
    item.innerHTML = jogo;
    lista.appendChild(item);
});
</script>

</body>
</html>
